# Every 15 minutes: restore the DB from the `data` branch, run one bounded pipeline tick
# (index → funding → cluster/metrics → testnet snapshots → Nansen hub checks), save the DB,
# export the static API, build the static site and deploy it to Vercel (Hobby). The backend (pipeline,
# DB on the `data` branch, testnet snapshots) stays on GitHub Actions. $0 hosting.
name: tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      MONAD_MAINNET_RPC_URL: ${{ vars.MONAD_MAINNET_RPC_URL || 'https://rpc1.monad.xyz' }}
      MONAD_MAINNET_LOGS_RPC_URLS: ${{ vars.MONAD_MAINNET_LOGS_RPC_URLS || 'https://rpc1.monad.xyz,https://rpc-mainnet.monadinfra.com,https://rpc.monad.xyz' }}
      MONAD_MAINNET_LOGS_RANGE: ${{ vars.MONAD_MAINNET_LOGS_RANGE || '100' }}
      # Full-history endpoints for funding resolution (archive state + debug traces), 4 in flight each.
      MONAD_MAINNET_ARCHIVE_RPC_URLS: ${{ vars.MONAD_MAINNET_ARCHIVE_RPC_URLS || 'https://rpc1.monad.xyz,https://rpc-mainnet.monadinfra.com,https://rpc2.monad.xyz' }}
      ARCHIVE_RPC_CONCURRENCY: ${{ vars.ARCHIVE_RPC_CONCURRENCY || '12' }}
      FUNDING_CONCURRENCY: ${{ vars.FUNDING_CONCURRENCY || '8' }}
      TICK_FUNDING_SECONDS: ${{ vars.TICK_FUNDING_SECONDS || '240' }}
      MONAD_TESTNET_RPC_URL: ${{ vars.MONAD_TESTNET_RPC_URL || 'https://testnet-rpc.monad.xyz' }}
      NUNO_FEED_ADDRESS: ${{ vars.NUNO_FEED_ADDRESS }}
      PUBLISHER_PRIVATE_KEY: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
      NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
      MIN_BUYERS: ${{ vars.MIN_BUYERS || '0' }}
      TICK_MAX_BLOCKS: ${{ vars.TICK_MAX_BLOCKS || '8000' }}
      BACKFILL_DAYS: ${{ vars.BACKFILL_DAYS || '7' }}
      CONTRAST_LABEL: ${{ vars.CONTRAST_LABEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore DB
        run: scripts/data-pull.sh
      - name: Tick
        id: tick
        run: |
          if [ ! -f data/nuno.sqlite ]; then echo "No DB on the data branch: run the backfill locally and scripts/data-push.sh first"; exit 1; fi
          pnpm tick
      - name: Save DB
        if: steps.tick.outputs.commit == 'true'
        run: scripts/data-push.sh tick
      - name: Export static API
        run: |
          pnpm export:static
          if [ -f data/contrast.sqlite ]; then
            LOCAL_DB_PATH=./data/contrast.sqlite EXPORT_DIR=.contrast-export EXPORT_LABEL="$CONTRAST_LABEL" pnpm export:static
            mv .contrast-export/api site/api/contrast
          fi
      - name: Build site
        env:
          # Served from the domain root on Vercel. SITE_URL (repo variable) is the public URL, used for
          # Open Graph links, API examples and the logo cache.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          LOGOS_CACHE_URL: ${{ vars.SITE_URL && format('{0}/api/logos.json', vars.SITE_URL) || '' }}
        run: |
          pnpm web:build
          cp -r site/api apps/web/out/api
          cp apps/web/vercel.json apps/web/out/vercel.json
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set: skipping deploy"; exit 0; fi
          npx -y vercel@39.1.1 deploy apps/web/out --prod --yes --token "$VERCEL_TOKEN"
